<!DOCTYPE html>
<html>
<body>
  <div class="tabs" role="tablist" aria-label="Wireframes">
    <button role="tab" aria-selected="true" aria-controls="v-home" id="t-home" type="button">Homepage (desktop)</button>
    <button role="tab" aria-selected="false" aria-controls="v-mobile" id="t-mobile" type="button">Homepage (mobile)</button>
    <button role="tab" aria-selected="false" aria-controls="v-product" id="t-product" type="button">Product page template</button>
  </div>
  <div id="v-home">Home</div>
  <div id="v-mobile" hidden>Mobile</div>
  <div id="v-product" hidden>Product</div>
  <script>
(function(){
  var tabs=document.querySelectorAll('[role="tab"]');
  function show(id){
    tabs.forEach(function(t){
      var on=t.getAttribute('aria-controls')===id;
      t.setAttribute('aria-selected',on?'true':'false');
      t.setAttribute('tabindex',on?'0':'-1');
      document.getElementById(t.getAttribute('aria-controls')).hidden=!on;
    });
  }
  tabs.forEach(function(t, index){
    t.setAttribute('tabindex',t.getAttribute('aria-selected')==='true'?'0':'-1');
    t.addEventListener('click',function(){show(t.getAttribute('aria-controls'));});
    t.addEventListener('keydown',function(e){
      var dir = e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
      if(dir){
        e.preventDefault();
        var next = tabs[(index + dir + tabs.length) % tabs.length];
        next.focus();
        show(next.getAttribute('aria-controls'));
      }
    });
  });
})();
  </script>
</body>
</html>
